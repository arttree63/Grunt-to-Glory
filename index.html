<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Grunt to Glory — 小兵的故事</title>
    <meta name="description" content="Clicker idle RPG: rise from a nameless grunt to a legendary hero." />
    <style>
      /* 進場 splash:JS bundle 下載期間就要看得到,所以樣式必須內嵌在 head、
         標記直接放在 #root 裡(React 掛載時原地換掉)。
         App 的 !loaded 分支渲染同一組 class → 從「下載中」到「讀檔中」無縫。 */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 30%, #241a30, #141018 70%);
        color: #e8dcc8;
        font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
        user-select: none;
        z-index: 99;
      }
      .boot-splash .flame {
        width: 14px;
        height: 22px;
        border-radius: 50% 50% 42% 42%;
        background: linear-gradient(180deg, #ffd23e, #ff7a3c 65%, #c8384a);
        box-shadow: 0 0 24px #ff9a4c88, 0 0 60px #ff7a3c44;
        animation: boot-flicker 0.9s ease-in-out infinite;
        transform-origin: 50% 90%;
      }
      .boot-splash h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 10px;
        text-indent: 10px; /* 抵銷最後一字的字距,視覺置中 */
        color: #f2c14e;
        text-shadow: 0 2px 12px #00000088;
      }
      .boot-splash small {
        font-size: 12px;
        letter-spacing: 4px;
        color: #9a8fb0;
      }
      .boot-splash .bar {
        width: 150px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: #2c2438;
      }
      .boot-splash .bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #b8862c, #f2c14e);
        animation: boot-march 1.1s ease-in-out infinite;
      }
      @keyframes boot-flicker {
        0%, 100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        35% { transform: scaleY(1.15) scaleX(0.92); opacity: 0.92; }
        70% { transform: scaleY(0.9) scaleX(1.06); }
      }
      @keyframes boot-march {
        0% { transform: translateX(-160%); }
        100% { transform: translateX(420%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React 掛載前的靜態畫面:小兵在營火邊整裝。掛載後由 App 的 !loaded 分支接手同樣的畫面 -->
      <div class="boot-splash">
        <div class="flame"></div>
        <h1>小 兵 的 故 事</h1>
        <small>整 裝 行 軍 中</small>
        <div class="bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
