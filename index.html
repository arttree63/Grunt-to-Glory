<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Grunt to Glory — 小兵的故事</title>
    <meta name="description" content="Clicker idle RPG: rise from a nameless grunt to a legendary hero." />
    <style>
      /* 進場標題畫面:JS bundle 下載期間就要看得到,所以樣式必須內嵌在 head、
         標記直接放在 #root 裡(React 掛載時由 TitleScreen 用同一組 class 原地接手)。
         ⚠️ 這裡一律寫死色值,不能用 styles.css 的 CSS 變數——那份是非阻塞載入的,
         可能比這個畫面晚到,用變數會整片失色。 */
      .title-screen {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: flex;
        justify-content: center;
        background: #141018;
        color: #e8dcc8;
        font-family: 'PingFang TC', 'Noto Sans TC', sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .title-stage {
        position: relative;
        width: 100%;
        max-width: 440px; /* 與遊戲主畫面 .wrap 同寬,桌機才不會兩邊對不齊 */
        display: flex;
        flex-direction: column;
        /* 螢幕比畫更高時,上緣用畫作天空的同一個色往上接,看不出接縫 */
        background: linear-gradient(180deg, #0c1022 0%, #0c1022 45%, #141018 100%);
      }
      .title-scene {
        position: relative;
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        overflow: hidden;
      }
      /* 畫一律撐滿寬度、底邊貼齊選單:小兵永遠站在按鈕正上方。
         螢幕不夠高時多出來的部分從**上緣**切掉(上面是天空,切掉不心疼),
         切太多才退回等比縮小(max-height),那時兩側才會出現底色。 */
      .title-art {
        width: 100%;
        height: auto;
        max-height: 132%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.45s ease;
      }
      .title-art.on {
        opacity: 1;
      }
      /* 下緣淡出到底色:蓋掉畫的裁切邊,讓選單像長在場景裡 */
      .title-veil {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        /* 只吃掉小兵腳下那條地面:再高就會把主角一起吃掉,他必須是最亮的東西 */
        height: 16%;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(20, 16, 24, 0) 0%,
          rgba(20, 16, 24, 0.1) 40%,
          rgba(20, 16, 24, 0.6) 75%,
          #141018 100%
        );
      }
      /* 畫還沒下載完之前的替身:營火 + 標題。沒有它就是一片黑 */
      .title-fallback {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        transition: opacity 0.45s ease;
      }
      .title-screen.art-on .title-fallback {
        opacity: 0;
      }
      .title-flame {
        width: 14px;
        height: 22px;
        border-radius: 50% 50% 42% 42%;
        background: linear-gradient(180deg, #ffd23e, #ff7a3c 65%, #c8384a);
        box-shadow: 0 0 24px #ff9a4c88, 0 0 60px #ff7a3c44;
        animation: boot-flicker 0.9s ease-in-out infinite;
        transform-origin: 50% 90%;
      }
      .title-name {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 10px;
        text-indent: 10px; /* 抵銷最後一字的字距,視覺置中 */
        color: #f2c14e;
        text-shadow: 0 2px 12px #00000088;
      }
      /* 底部選單區:讀檔中是行軍進度條,讀完換成開始鍵。高度固定,兩態不跳版 */
      .title-panel {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        min-height: 136px;
        padding: 0 22px max(20px, env(safe-area-inset-bottom, 0px));
        background: #141018; /* 與 veil 收尾同色,畫的底邊才接得起來 */
      }
      .title-panel small {
        font-size: 12px;
        letter-spacing: 4px;
        color: #9a8fb0;
      }
      .title-bar {
        width: 150px;
        height: 4px;
        border-radius: 2px;
        overflow: hidden;
        background: #2c2438;
      }
      .title-bar i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #b8862c, #f2c14e);
        animation: boot-march 1.1s ease-in-out infinite;
      }
      /* 抓得到實際進度就換成量得出來的條:等待有多久看得見,比原地行軍誠實 */
      .title-bar.det i {
        animation: none;
        transform: none;
        transition: width 0.2s linear;
      }
      .title-start {
        width: 100%;
        max-width: 300px;
        min-height: 56px;
        border: 1px solid #f2c14e77;
        border-radius: 12px;
        background: linear-gradient(180deg, #3d2e5c, #281f3c);
        color: #f2c14e;
        font-family: inherit;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 6px;
        text-indent: 6px; /* 同 h1:抵銷末字字距 */
        cursor: pointer;
        animation: title-cta 2.6s ease-in-out infinite;
      }
      .title-start:active {
        transform: translateY(1px);
      }
      .title-meta {
        font-size: 11px;
        letter-spacing: 2px;
        color: #8d80a6;
      }
      @keyframes boot-flicker {
        0%, 100% { transform: scaleY(1) scaleX(1); opacity: 1; }
        35% { transform: scaleY(1.15) scaleX(0.92); opacity: 0.92; }
        70% { transform: scaleY(0.9) scaleX(1.06); }
      }
      @keyframes boot-march {
        0% { transform: translateX(-160%); }
        100% { transform: translateX(420%); }
      }
      @keyframes title-cta {
        0%, 100% { box-shadow: 0 0 14px #f2c14e22, inset 0 1px 0 #ffffff12; }
        50% { box-shadow: 0 0 26px #f2c14e55, inset 0 1px 0 #ffffff12; }
      }
      @media (prefers-reduced-motion: reduce) {
        .title-flame,
        .title-bar i,
        .title-start {
          animation: none;
        }
        .title-art,
        .title-fallback {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React 掛載前的靜態標題畫面;掛載後 TitleScreen 用同一組 class 接手,畫面不跳。
           圖走 <img> 而不是 CSS background:瀏覽器解析 HTML 時就開始下載,
           不必等 200KB+ 的 JS 跑完才知道要抓這張圖。 -->
      <div class="title-screen">
        <div class="title-stage">
          <div class="title-scene">
            <img
              class="title-art"
              src="./assets/visual/scenes/title-v1.webp"
              alt="小兵的故事"
              fetchpriority="high"
              decoding="async"
              onload="this.classList.add('on');this.closest('.title-screen').classList.add('art-on')"
            />
            <div class="title-fallback">
              <div class="title-flame"></div>
              <h1 class="title-name">小 兵 的 故 事</h1>
            </div>
            <div class="title-veil"></div>
          </div>
          <div class="title-panel">
            <div class="title-bar"><i></i></div>
            <small>整 裝 行 軍 中</small>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
